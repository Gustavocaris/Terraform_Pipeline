name: "PROD DEPLOY"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      aws-assume-role-arn: arn:aws:iam::833899002257:role/github-actions-gustavodevops-pipeline
      aws-region: sa-east-1
      aws-statefile-s3-bucket: gustavocaris-sa-east-1-terraform-statefile
      aws-lock-dynamodb-table: gustavocaris-sa-east-1-terraform-lock
